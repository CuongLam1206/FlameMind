# Stack triển khai e2e: web (nginx phục dist + proxy /api) + gateway API + MQTT + Timescale.
# Chạy: docker compose up -d --build từ thư mục fireguard/
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /srv

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: fireguard_dev_only
    ports:
      - "5432:5432"
